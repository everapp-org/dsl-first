name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kernel-grammar:
    # The grammar in KERNEL_DSL.md must read every example of KERNEL_DSL.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lark==1.3.1
      - run: python3 tools/check_kernel_grammar.py
